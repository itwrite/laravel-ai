<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>商品促销价签 (10cm x 6cm)</title>
    <style>
        /* 页面打印设置 */
        @page {
            size: 100mm 60mm;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang SC", "Microsoft YaHei", "Arial", sans-serif;
        }

        body {
            //width: 100mm;
            //height: 60mm;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            padding: 20mm;
        }

        /* 外框容器（防剪裁内边距） */
        .tag-card {
            width: 100mm;
            height: 60mm;
            padding: 3mm;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 1px dashed #ccc; /* 视预览而定，实际打印可留作裁切线 */
        }

        /* 1. 头部区域 */
        .header {
            background-color: #d32f2f;
            color: #ffffff;
            height: 9mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4mm;
            border-radius: 2mm 2mm 0 0;
        }

        .header .title {
            font-size: 14pt;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff176; /* 靓丽黄 */
            text-transform: uppercase;
        }

        .header .store-name {
            font-size: 8pt;
            opacity: 0.9;
        }

        /* 2. 商品名称 */
        .product-info {
            padding: 1.5mm 1mm 0 1mm;
        }

        .product-name {
            font-size: 11pt;
            font-weight: bold;
            line-height: 1.2;
            height: 8.5mm;
            color: #111;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-spec {
            font-size: 7.5pt;
            color: #666;
            margin-top: 1mm;
        }

        /* 3. 价格核心区 */
        .price-section {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            background: #fff8e1;
            border: 1.5px solid #d32f2f;
            border-radius: 2mm;
            padding: 1.5mm 3mm;
            margin: 1mm 0;
        }

        .original-price-box {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .original-price-title {
            font-size: 6.5pt;
            color: #666;
        }

        .original-price {
            font-size: 9pt;
            color: #777;
            text-decoration: line-through;
            font-weight: bold;
        }

        .promo-price-box {
            display: flex;
            align-items: baseline;
            color: #d32f2f;
        }

        .promo-label {
            font-size: 9pt;
            font-weight: bold;
            margin-right: 1mm;
        }

        .currency {
            font-size: 12pt;
            font-weight: bold;
        }

        .price-integer {
            font-size: 26pt;
            font-weight: 900;
            line-height: 0.9;
            font-family: "Impact", "Arial Black", sans-serif;
        }

        .price-decimal {
            font-size: 14pt;
            font-weight: bold;
            font-family: "Impact", "Arial Black", sans-serif;
        }

        .unit {
            font-size: 8pt;
            color: #333;
            margin-left: 1mm;
        }

        /* 4. 底部条码及活动信息 */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 1mm;
        }

        .barcode-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* CSS 模拟模拟条形码 */
        .barcode {
            width: 38mm;
            height: 6mm;
            background: repeating-linear-gradient(
                90deg,
                #000 0mm, #000 0.3mm,
                #fff 0.3mm, #fff 0.6mm,
                #000 0.6mm, #000 1.2mm,
                #fff 1.2mm, #fff 1.5mm,
                #000 1.5mm, #000 1.8mm,
                #fff 1.8mm, #fff 2.0mm
            );
        }

        .sku-code {
            font-size: 6.5pt;
            font-family: monospace;
            color: #444;
            margin-top: 0.5mm;
        }

        .promo-date {
            font-size: 6.5pt;
            color: #d32f2f;
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="tag-card">
    <!-- 头部标题栏 -->
    <div class="header">
        <span class="title">限时特惠</span>
        <span class="store-name">连锁精品超市</span>
    </div>

    <!-- 商品名称与规格 -->
    <div class="product-info">
        <div class="product-name">304不锈钢智能显温保温杯（500ml）</div>
        <div class="product-spec">规格: 500ml | 产地: 浙江 | 单位: 个</div>
    </div>

    <!-- 价格对比区 -->
    <div class="price-section">
        <div class="original-price-box">
            <span class="original-price-title">原零售价</span>
            <span class="original-price">￥128.00</span>
        </div>
        <div class="promo-price-box">
            <span class="promo-label">促销价</span>
            <span class="currency">¥</span>
            <span class="price-integer">39</span>
            <span class="price-decimal">.90</span>
            <span class="unit">/个</span>
        </div>
    </div>

    <!-- 底部条形码与时间 -->
    <div class="footer">
        <div class="barcode-area">
            <div class="barcode"></div>
            <div class="sku-code">SKU: 6970123456789</div>
        </div>
        <div class="promo-date">
            <div>活动周期：</div>
            <div>10.01 - 10.07</div>
        </div>
    </div>
</div>

</body>
</html>
