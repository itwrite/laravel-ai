<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小学二年级下学期期中考试模拟试卷</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "SimSun", "宋体", "Noto Serif CJK SC", "Microsoft YaHei", serif;
      font-size: 14px;
      line-height: 1.7;
      color: #222;
      background: #f0f0f0;
      padding: 20px;
    }

    .toolbar {
      max-width: 210mm;
      margin: 0 auto 16px;
      background: #fff;
      border-radius: 10px;
      padding: 12px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .toolbar .title { font-size: 15px; font-weight: bold; color: #333; margin-right: 8px; }
    .toolbar button {
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-print { background: #2563eb; color: #fff; }
    .btn-print:hover { background: #1d4ed8; }
    .btn-pdf { background: #059669; color: #fff; }
    .btn-pdf:hover { background: #047857; }
    .btn-pdf:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn-jump { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db !important; }
    .btn-jump:hover { background: #e5e7eb; }
    .status-msg { font-size: 13px; color: #059669; min-width: 100px; }

    .paper {
      max-width: 210mm;
      min-height: 297mm;
      margin: 0 auto 28px;
      background: #fff;
      padding: 14mm 14mm;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      position: relative;
    }

    .paper-header {
      text-align: center;
      margin-bottom: 10px;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
    }
    .paper-header h1 {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .paper-header .subject {
      font-size: 17px;
      font-weight: bold;
      margin: 4px 0;
      letter-spacing: 8px;
    }
    .info-row {
      display: flex;
      justify-content: center;
      gap: 36px;
      font-size: 13px;
      margin-top: 6px;
    }
    .underline {
      display: inline-block;
      border-bottom: 1px solid #333;
      min-width: 70px;
      height: 16px;
      vertical-align: bottom;
    }
    .notice {
      font-size: 12px;
      color: #555;
      text-align: center;
      margin: 6px 0 12px;
    }

    .section {
      margin-bottom: 14px;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .section-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      padding-bottom: 2px;
      border-bottom: 1px dashed #999;
      page-break-after: avoid;
      break-after: avoid;
    }

    .question { margin-bottom: 8px; padding-left: 2px; }
    .q-content { margin-bottom: 2px; }

    .blank {
      display: inline-block;
      border-bottom: 1px solid #333;
      min-width: 56px;
      height: 15px;
      margin: 0 2px;
      vertical-align: bottom;
    }
    .blank-long { min-width: 180px; }
    .blank-full {
      display: block;
      border-bottom: 1px solid #ccc;
      height: 26px;
      margin: 3px 0;
    }

    .options {
      margin: 3px 0 3px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
    }
    .option-item { min-width: 70px; }

    .pinyin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 16px;
      margin: 4px 0 8px 6px;
    }
    .pinyin-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .reading-box {
      border: 1px solid #999;
      padding: 8px 10px;
      margin: 6px 0 10px;
      background: #fafafa;
      line-height: 1.75;
      text-indent: 2em;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .reading-title {
      text-align: center;
      font-weight: bold;
      text-indent: 0;
      margin-bottom: 4px;
    }

    .writing-section {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .writing-area {
      border: 1px solid #999;
      margin-top: 6px;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .writing-line {
      border-bottom: 1px solid #ddd;
      height: 28px;
    }
    .writing-line:last-child { border-bottom: none; }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px 10px;
      margin: 4px 0 8px 4px;
    }

    .vertical-calc {
      display: flex;
      gap: 28px;
      margin: 8px 0 10px 6px;
      flex-wrap: wrap;
    }
    .v-item { text-align: center; min-width: 64px; }
    .v-item .num { display: block; line-height: 1.35; }

    .answer-line {
      margin: 3px 0 6px 16px;
      color: #555;
    }

    .footer-note {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #666;
      border-top: 1px dashed #ccc;
      padding-top: 8px;
    }

    .page-break { page-break-after: always; }

    @media print {
      body { background: #fff; padding: 0; }
      .paper {
        box-shadow: none;
        margin: 0;
        padding: 10mm 12mm;
        max-width: 100%;
      }
      .page-break { page-break-after: always; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="toolbar no-print">
    <span class="title">📄 JSON 驱动试卷 Demo</span>
    <button class="btn-print" onclick="window.print()">🖨️ 打印</button>
    <button class="btn-pdf" id="btnExportPdf" onclick="exportToPdf()">📥 导出 PDF</button>
    <button class="btn-jump" onclick="scrollToSubject('数学')">跳到数学 →</button>
    <span class="status-msg" id="statusMsg"></span>
  </div>

  <div id="examContainer"></div>

  <script>
    /* ============================================================
     *  ① 试卷 JSON 数据（替换这里即可换一套试卷）
     * ============================================================ */
    const examData = {
      "title": "小学一年级语文期中考试试卷",
      "grade": 1,
      "semester": 1,
      "exam_type": "期中",
      "year": 2026,
      "papers": [
        {
          "subject": "语文",
          "total_score": 100,
          "duration_minutes": 60,
          "sections": [
            {
              "no": 1,
              "title": "一、看拼音写词语（共10分，每词1分）",
              "type": "pinyin_write",
              "questions": [
                { "no": "1", "pinyin": "māo yǎo", "answer": "猫腰" },
                { "no": "2", "pinyin": "wān yuè", "answer": "弯月" },
                { "no": "3", "pinyin": "dōu fāng", "answer": "豆腐" },
                { "no": "4", "pinyin": "xīn shí", "answer": "心事" },
                { "no": "5", "pinyin": "liǎn dāo", "answer": "脸蛋" }
              ]
            },
            {
              "no": 2,
              "title": "二、组词（共10分，每词1分）",
              "type": "text_list",
              "questions": [
                { "no": "1", "content": "快（　　）　慢（　　）", "answer": "快车；慢车" },
                { "no": "2", "content": "青（　　）　水（　　）", "answer": "青天；水桶" },
                { "no": "3", "content": "白（　　）　花（　　）", "answer": "白天；花朵" },
                { "no": "4", "content": "高（　　）　地（　　）", "answer": "高山；大地" },
                { "no": "5", "content": "黑（　　）　亮（　　）", "answer": "黑人；亮光" }
              ]
            },
            {
              "no": 3,
              "title": "三、照样子写句子（共10分，每句2分）",
              "type": "sentence_expand",
              "questions": [
                { "no": "1", "content": "小鸭子在水里游泳。 →" },
                { "no": "2", "content": "小花在花丛中跳舞。 →" },
                { "no": "3", "content": "小鸟在天空中飞翔。 →" }
              ]
            },
            {
              "no": 4,
              "title": "四、按要求写句子（共10分，每句2分）",
              "type": "sentence_req",
              "questions": [
                { "no": "1", "content": "把句子写完整：春天来了，", "suffix": "。" },
                { "no": "2", "content": "夏天来了，" },
                { "no": "3", "content": "秋天来了，" }
              ]
            },
            {
              "no": 5,
              "title": "五、阅读理解（共20分）",
              "type": "reading",
              "passage": {
                "title": "小兔子找朋友",
                "content": "小兔子非常喜欢交朋友。有一天，小兔子想：我该找谁做朋友呢？它想了想，决定去找小狗。小兔子找到了小狗，和小狗一起玩了很久。第二天，小兔子又想：我该找谁做朋友呢？它决定去找小猫。小兔子找到了小猫，和小猫一起玩了很久。小兔子非常开心，它找到了很多朋友。"
              },
              "questions": [
                { "no": "1", "content": "小兔子喜欢做什么？", "lines": 1, "answer": "小兔子喜欢交朋友。" },
                { "no": "2", "content": "小兔子第一天找谁做朋友？", "lines": 1, "answer": "小兔子第一天找小狗做朋友。" },
                { "no": "3", "content": "小兔子最后有什么感受？", "lines": 1, "answer": "小兔子最后非常开心，它找到了很多朋友。" }
              ]
            },
            {
              "no": 6,
              "title": "六、写话（共20分）",
              "type": "writing",
              "topic": "我的好朋友",
              "requirement": "写一写你的好朋友，包括他的名字、年龄、爱好和你们在一起做的事情。",
              "lines": 6
            }
          ]
        }
      ]
    };

    window.examData = examData;

    /* ============================================================
     *  ② 渲染引擎
     * ============================================================ */
    function renderExam(data) {
      const container = document.getElementById('examContainer');
      container.innerHTML = '';

      data.papers.forEach((paper, paperIndex) => {
        const paperEl = document.createElement('div');
        paperEl.className = 'paper';
        paperEl.id = 'paper-' + paper.subject;
        paperEl.dataset.subject = paper.subject;

        let html = `
          <div class="paper-header">
            <h1>${escapeHtml(data.title)}</h1>
            <div class="subject">${escapeHtml(paper.subject.split('').join('　'))}</div>
            <div class="info-row">
              <span>姓名：<span class="underline"></span></span>
              <span>班级：<span class="underline"></span></span>
              <span>得分：<span class="underline"></span></span>
            </div>
          </div>
          <div class="notice">注意事项：认真审题，字迹工整。本卷满分${paper.total_score}分，考试时间${paper.duration_minutes}分钟。</div>
        `;

        paper.sections.forEach(section => {
          html += renderSection(section);
        });

        html += `<div class="footer-note">—— ${escapeHtml(paper.subject)}试卷结束，请仔细检查 ——</div>`;
        paperEl.innerHTML = html;
        container.appendChild(paperEl);

        if (paperIndex < data.papers.length - 1) {
          const br = document.createElement('div');
          br.className = 'page-break';
          container.appendChild(br);
        }
      });
    }

    function renderSection(section) {
      let html = `<div class="section ${section.type === 'writing' ? 'writing-section' : ''}">`;
      html += `<div class="section-title">${escapeHtml(section.title)}。（${escapeHtml(section.score_text)}）</div>`;

      if (section.hint) {
        html += `<div class="notice" style="text-align:left;margin:2px 0 6px;">${escapeHtml(section.hint)}</div>`;
      }

      switch (section.type) {
        case 'pinyin_write':
          html += '<div class="pinyin-grid">';
          section.questions.forEach(q => {
            html += `<div class="pinyin-item">${q.no}. ${escapeHtml(q.pinyin)} <span class="blank"></span></div>`;
          });
          html += '</div>';
          break;

        case 'text_list':
          section.questions.forEach(q => {
            html += `<div class="question">${q.no}. ${escapeHtml(q.content)}</div>`;
          });
          break;

        case 'sentence_expand':
        case 'sentence_req':
          section.questions.forEach(q => {
            const suffix = q.suffix ? escapeHtml(q.suffix) : '';
            html += `<div class="question">${q.no}. ${escapeHtml(q.content)} <span class="blank blank-long"></span>${suffix}</div>`;
          });
          break;

        case 'reading':
          if (section.passage) {
            html += `<div class="reading-box">
              <div class="reading-title">${escapeHtml(section.passage.title)}</div>
              ${escapeHtml(section.passage.content)}
            </div>`;
          }
          section.questions.forEach(q => {
            html += `<div class="question">${q.no}. ${escapeHtml(q.content)}</div>`;
            html += `<div class="answer-line">答：</div>`;
            const lines = q.lines || 1;
            for (let i = 0; i < lines; i++) html += '<div class="blank-full"></div>';
          });
          break;

        case 'writing':
          html += `<div class="question">题目：<b>${escapeHtml(section.topic)}</b></div>`;
          html += `<div class="notice" style="text-align:left;">要求：${escapeHtml(section.requirement)}</div>`;
          html += '<div class="writing-area">';
          for (let i = 0; i < (section.lines || 6); i++) html += '<div class="writing-line"></div>';
          html += '</div>';
          break;

        case 'calc_grid':
          html += '<div class="calc-grid">';
          section.questions.forEach(q => {
            html += `<div>${q.no}. ${escapeHtml(q.content)}</div>`;
          });
          html += '</div>';
          break;

        case 'choice':
          section.questions.forEach(q => {
            html += `<div class="question">
              <div class="q-content">${q.no}. ${escapeHtml(q.content)}</div>
              <div class="options">
                ${(q.options || []).map(opt => `<span class="option-item">${escapeHtml(opt)}</span>`).join('')}
              </div>
            </div>`;
          });
          break;

        case 'calc_mixed':
          (section.parts || []).forEach(part => {
            html += `<div class="notice" style="text-align:left;margin:6px 0 4px;">${escapeHtml(part.subtitle)}</div>`;
            if (part.type === 'vertical') {
              html += '<div class="vertical-calc">';
              part.questions.forEach(q => {
                html += `<div class="v-item">
                  <span class="num">${q.no}.</span>
                  ${(q.lines || []).map(l => `<span class="num">${escapeHtml(l)}</span>`).join('')}
                  <span class="num">────</span>
                  <span class="num">　　</span>
                </div>`;
              });
              html += '</div>';
            } else if (part.type === 'step') {
              html += '<div class="question">';
              html += part.questions.map(q => `${q.no}. ${escapeHtml(q.content)}`).join('　　　　　　');
              html += '</div><div style="height:36px;"></div>';
            }
          });
          break;

        case 'application':
          section.questions.forEach(q => {
            html += `<div class="question" style="margin-top:8px;">${q.no}. ${escapeHtml(q.content)}</div>`;
            html += `<div class="answer-line">算式：________________________　　答：____________</div>`;
          });
          break;

        default:
          (section.questions || []).forEach(q => {
            html += `<div class="question">${q.no || ''}. ${escapeHtml(q.content || '')}</div>`;
          });
      }

      html += '</div>';
      return html;
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function scrollToSubject(subject) {
      const el = document.getElementById('paper-' + subject);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    /* ============================================================
     *  ③ 导出 PDF
     * ============================================================ */
    async function exportToPdf() {
      const btn = document.getElementById('btnExportPdf');
      const status = document.getElementById('statusMsg');

      if (typeof html2pdf === 'undefined') {
        status.textContent = '❌ PDF 库加载失败';
        status.style.color = '#dc2626';
        return;
      }

      btn.disabled = true;
      status.textContent = '正在生成 PDF…';
      status.style.color = '#059669';

      try {
        const element = document.createElement('div');
        element.style.width = '190mm';
        element.style.background = '#fff';
        element.style.color = '#222';
        element.style.fontFamily = '"SimSun","宋体","Noto Serif CJK SC","Microsoft YaHei",serif';

        const papers = document.querySelectorAll('.paper');
        papers.forEach((paper, idx) => {
          const clone = paper.cloneNode(true);
          clone.style.boxShadow = 'none';
          clone.style.margin = '0';
          clone.style.maxWidth = '100%';
          clone.style.minHeight = 'auto';
          clone.style.padding = '8mm 6mm';
          if (idx < papers.length - 1) {
            clone.style.pageBreakAfter = 'always';
            clone.style.breakAfter = 'page';
          }
          element.appendChild(clone);
        });

        const opt = {
          margin: [8, 8, 8, 8],
          filename: (examData.title || '试卷') + '.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: {
            scale: 2,
            useCORS: true,
            logging: false,
            letterRendering: true,
            scrollY: 0,
            windowWidth: 794
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
          pagebreak: {
            mode: ['css', 'legacy'],
            avoid: ['.section', '.writing-section', '.reading-box', '.writing-area', '.section-title']
          }
        };

        await html2pdf().set(opt).from(element).save();
        status.textContent = '✅ PDF 已下载';
      } catch (err) {
        console.error(err);
        status.textContent = '❌ 生成失败';
        status.style.color = '#dc2626';
      } finally {
        btn.disabled = false;
        setTimeout(() => {
          if (status.textContent.includes('已下载')) status.textContent = '';
        }, 3500);
      }
    }

    /* ============================================================
     *  ④ 启动
     * ============================================================ */
    renderExam(examData);

    console.log('%c试卷已由 JSON 渲染。替换 window.examData 后执行 renderExam(window.examData) 即可换卷。', 'color:#059669;font-weight:bold');
  </script>
</body>
</html>
